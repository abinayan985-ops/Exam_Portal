<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Online Exam System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #065f46,
                #134e4a,
                #0f172a
            );
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 900px;
            min-height: 500px;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .left-panel {
            background: linear-gradient(135deg, #0d9488, #047857);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        .cap-icon {
            background: rgba(255, 255, 255, 0.15);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 25px;
        }

        .cap-icon i {
            font-size: 60px;
        }

        .right-panel {
            background: white;
            padding: 45px;
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: #0d9488;
            box-shadow: 0 0 0 0.2rem rgba(13, 148, 136, 0.2);
        }

        .login-btn {
            background: #334155;
            color: white;
            padding: 12px;
            border-radius: 10px;
        }

        .login-btn:hover {
            background: #1e293b;
            color: white;
        }

        .microsoft-btn {
            background: #0f766e;
            color: white;
            padding: 12px;
            border-radius: 10px;
        }

        .microsoft-btn:hover {
            background: #115e59;
            color: white;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #9ca3af;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        @media (max-width: 767px) {
            .right-panel {
                padding: 30px 22px;
            }

            .left-panel {
                padding: 35px 20px;
            }

            .cap-icon i {
                font-size: 45px;
            }
        }
    </style>
</head>

<body>

    <div class="login-card row g-0">

        <!-- Left Panel -->
        <div class="col-md-6 left-panel">

            <div class="cap-icon">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>

            <h2 class="fw-bold">Examination Portal</h2>

            <p class="mt-2">
                Effortless &amp; Secure Exam Delivery
            </p>

        </div>

        <!-- Right Panel -->
        <div class="col-md-6 right-panel">

            <h3 class="text-center fw-bold mb-4">
                Login
            </h3>

            <!-- Django Error Message -->
            {% if error %}
                <div class="alert alert-danger text-center small">
                    {{ error }}
                </div>
            {% endif %}

            <!-- Login Form -->
            <form method="POST">

                {% csrf_token %}

                <!-- Username -->
                <div class="mb-3">

                    <label class="form-label small fw-semibold">
                        Email or Username
                    </label>

                    <div class="input-group">
                        <span class="input-group-text bg-white">
                            <i class="fa-regular fa-envelope"></i>
                        </span>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Enter your email or username"
                            required
                        >
                    </div>

                </div>

                <!-- Password -->
                <div class="mb-4">

                    <label class="form-label small fw-semibold">
                        Password
                    </label>

                    <div class="input-group">
                        <span class="input-group-text bg-white">
                            <i class="fa-solid fa-lock"></i>
                        </span>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                </div>

                <!-- Login Button -->
                <button type="submit"
                        class="btn login-btn w-100">
                    Login
                </button>

            </form>

            <div class="divider my-4">
                OR
            </div>

            <!-- Microsoft Button -->
            <button type="button"
                    class="btn microsoft-btn w-100">
                <i class="fa-solid fa-right-to-bracket me-2"></i>
                Sign in with Microsoft
            </button>

        </div>

    </div>

</body>
</html>

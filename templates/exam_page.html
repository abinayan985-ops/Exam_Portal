<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam - {{ exam.title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-emerald-300 via-teal-400 to-slate-700 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl shadow-2xl max-w-5xl w-full p-6 md:p-8 flex flex-col md:flex-row gap-8">
        
        <!-- Left Side: Navigation & Timer -->
        <div class="md:w-1/3 bg-gray-50 p-5 rounded-2xl border border-gray-100 flex flex-col justify-between">
            <div>
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">Exam Navigation</h3>
                <div class="grid grid-cols-5 gap-2 mb-6">
                    {% for q in questions %}
                    <a href="#q_{{ q.id }}" class="w-10 h-10 rounded-xl bg-white border border-gray-200 hover:bg-teal-500 hover:text-white flex items-center justify-center text-xs font-bold shadow-sm transition">
                        {{ forloop.counter }}
                    </a>
                    {% endfor %}
                </div>
            </div>
            
            <div class="bg-white p-4 rounded-xl border border-gray-200 text-center shadow-sm">
                <i class="fa-regular fa-clock text-teal-600 mr-2"></i>
                <span class="text-xs text-gray-500">Time left</span>
                <div id="timer" class="text-lg font-bold text-gray-800">59:51</div>
            </div>
        </div>

     
        <div class="md:w-2/3 flex flex-col justify-between">
            <form method="POST" action="{% url 'submit_exam' attempt.id %}" class="flex flex-col h-full justify-between">
                {% csrf_token %}
                <div>
                    <div class="bg-slate-800 text-white p-6 rounded-2xl mb-6 shadow-md">
                        <span class="text-xs text-teal-300 font-semibold tracking-wide uppercase">Question</span>
                        <h2 class="text-xl font-bold mt-1">Interactive Test Session</h2>
                        <p class="text-xs text-slate-300 mt-1">Select one appropriate answer choice below.</p>
                    </div>

                    <div class="space-y-6">
                        {% for q in questions %}
                        <div id="q_{{ q.id }}" class="p-4 bg-gray-50 rounded-2xl border border-gray-200">
                            <p class="font-semibold text-gray-800 text-sm mb-4">{{ forloop.counter }}. {{ q.question_text }}</p>
                            
                            <div class="space-y-2 text-sm">
                                <label class="flex items-center space-x-3 p-3 bg-white rounded-xl border border-gray-200 cursor-pointer hover:border-teal-500 transition">
                                    <input type="radio" name="question_{{ q.id }}" value="A" class="text-teal-600 focus:ring-teal-500">
                                    <span>A. {{ q.option_a }}</span>
                                </label>
                                <label class="flex items-center space-x-3 p-3 bg-white rounded-xl border border-gray-200 cursor-pointer hover:border-teal-500 transition">
                                    <input type="radio" name="question_{{ q.id }}" value="B" class="text-teal-600 focus:ring-teal-500">
                                    <span>B. {{ q.option_b }}</span>
                                </label>
                                <label class="flex items-center space-x-3 p-3 bg-white rounded-xl border border-gray-200 cursor-pointer hover:border-teal-500 transition">
                                    <input type="radio" name="question_{{ q.id }}" value="C" class="text-teal-600 focus:ring-teal-500">
                                    <span>C. {{ q.option_c }}</span>
                                </label>
                                <label class="flex items-center space-x-3 p-3 bg-white rounded-xl border border-gray-200 cursor-pointer hover:border-teal-500 transition">
                                    <input type="radio" name="question_{{ q.id }}" value="D" class="text-teal-600 focus:ring-teal-500">
                                    <span>D. {{ q.option_d }}</span>
                                </label>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <div class="flex justify-between items-center mt-8 pt-4 border-t border-gray-100">
                    <button type="button" class="px-6 py-2.5 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-600 text-sm font-semibold transition">Previous</button>
                    <button type="submit" class="px-6 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold shadow-md transition">Submit Exam</button>
                </div>
            </form>
        </div>

    </div>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Question - Tabor Study</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-purple-50 min-h-screen p-6 text-slate-700">

<div class="max-w-2xl mx-auto bg-white rounded-2xl shadow p-8">
    <h1 class="text-2xl font-bold text-purple-700 mb-6">
        Add New Question
    </h1>

    <form method="POST">
        

        <label class="block mb-2 font-semibold">Select Exam</label>
        <select name="exam" required
                class="w-full border rounded-lg p-3 mb-4">
            <option value="">Choose Exam</option>
            
            <option value="">Python Programming</option>
            
        </select>

        <label class="block mb-2 font-semibold">Question</label>
        <textarea name="question_text" required
                  class="w-full border rounded-lg p-3 mb-4"
                  placeholder="Enter question"></textarea>

        <label class="block mb-2 font-semibold">Option A</label>
        <input type="text" name="option_a" required
               class="w-full border rounded-lg p-3 mb-4">

        <label class="block mb-2 font-semibold">Option B</label>
        <input type="text" name="option_b" required
               class="w-full border rounded-lg p-3 mb-4">

        <label class="block mb-2 font-semibold">Option C</label>
        <input type="text" name="option_c" required
               class="w-full border rounded-lg p-3 mb-4">

        <label class="block mb-2 font-semibold">Option D</label>
        <input type="text" name="option_d" required
               class="w-full border rounded-lg p-3 mb-4">

        <label class="block mb-2 font-semibold">Correct Option</label>
        <select name="correct_option" required
                class="w-full border rounded-lg p-3 mb-6">
            <option value="">Choose Answer</option>
            <option value="A">Option A</option>
            <option value="B">Option B</option>
            <option value="C">Option C</option>
            <option value="D">Option D</option>
        </select>

        <button type="submit"
                class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-lg">
            Save Question
        </button>

        <a href="question_bank.html"
           class="ml-3 text-purple-700">
            Cancel
        </a>
    </form>
</div>

</body>
</html>

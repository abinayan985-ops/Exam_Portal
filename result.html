<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Results - ExamSim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<style>
    body {
        background-color: #583081 ;
    }

    header {
        background-color: #e9d5ff ;
    }

    .result-card {
        background-color: #d1b1f3 ;
        border-color: #c084fc ;
    }
</style>
<body class="bg-purple-50 min-h-screen">

    <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <span class="font-bold text-blue-600 text-xl tracking-wide">ExamSim</span>
        <a href="exam.html" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-xl transition">Back to Exams</a>
    </header>

    <main class="max-w-6xl mx-auto p-6 md:p-10">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-extrabold text-gray-800">Your Exam Results</h1>
            <p class="text-gray-500 text-sm mt-2">Here's how you performed in the exam. Review your performance below.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
           
              <div class="result-card p-6 rounded-2xl border shadow-sm">
                <span class="text-xs font-semibold text-grey-400 uppercase">Score</span>
                <div class="text-3xl font-extrabold text-grey-800 mt-2">4 / 100</div>
                <div class="w-full bg-purple-100 h-2 rounded-full mt-4 overflow-hidden">
                   <div class="bg-blue-600 h-full rounded-full" style="width: 4%;"></div>
                </div>
            </div>

         
               <div class="result-card p-6 rounded-2xl border shadow-sm">
                <span class="text-xs font-semibold text-grey-400 uppercase">Percentile & Rank</span>
                <div class="text-2xl font-extrabold text-grey-800 mt-2">99.9%ile</div>
                <p class="text-xs text-grey-400 mt-4">Rank: 1 of active students</p>
            </div>

          
               <div class="result-card p-6 rounded-2xl border shadow-sm">
                <span class="text-xs font-semibold text-grey-400 uppercase">Accuracy</span>
                <div class="text-3xl font-extrabold text-grey-800 mt-2">%</div>
                <p class="text-xs text-grey-400 mt-4">Calculated from answers</p>
            </div>

           
             <div class="result-card p-6 rounded-2xl border shadow-sm">
                <span class="text-xs font-semibold text-grey-400 uppercase">Performance</span>
                <div class="text-2xl font-extrabold text-green-600 mt-2">
                    ExcellentNeeds Improvement
                </div>
                <p class="text-xs text-grey-400 mt-4">Status: </p>
            </div>
        </div>
    </main>

<script>
document.addEventListener("DOMContentLoaded", function() {
    document.querySelectorAll("form").forEach(function(form) {
        form.addEventListener("submit", function(e) {
            e.preventDefault();
            const action = form.getAttribute("action");
            if (action && action.endsWith(".html")) {
                window.location.href = action;
            } else if (window.location.pathname.includes("exam_page")) {
                window.location.href = "result.html";
            } else if (window.location.pathname.includes("add_question")) {
                window.location.href = "questions.html";
            } else {
                window.location.href = "dashboard.html";
            }
        });
    });
});
</script>
</body>
</html>

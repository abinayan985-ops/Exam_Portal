<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question Bank - Tabor Study</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-purple-50 min-h-screen p-8 text-slate-700">
    <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-sm p-6 border border-purple-100">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-xl font-bold text-slate-900"><i class="fa-solid fa-question-circle text-purple-600 mr-2"></i>Question Bank</h1>
                <p class="text-xs text-slate-500 mt-1">Manage and view all exam questions</p>
            </div>
            <div class="flex gap-3">
                <a href=""
   class="text-xs bg-purple-600 text-white font-semibold px-4 py-2 rounded-xl">
    <i class="fa-solid fa-plus mr-1"></i>
    Add New Question
</a>
                <a href="" class="text-xs bg-purple-100 text-purple-700 font-semibold px-4 py-2 rounded-xl">Back to Dashboard</a>
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-slate-600">
                <thead class="bg-purple-50 text-purple-900 font-semibold border-b border-purple-100">
                    <tr>
                        <th class="p-3">#</th>
                        <th class="p-3">Exam Title</th>
                        <th class="p-3">Question Text</th>
                        <th class="p-3">Correct Option</th>
                        <th class="p-3">Action</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    
                    <tr class="hover:bg-purple-50/50">
                        <td class="p-3 font-semibold text-slate-900"></td>
                        <td class="p-3"><span class="px-2 py-1 bg-purple-100 text-purple-700 text-xs rounded-lg font-medium"></span></td>
                        <td class="p-3 font-medium text-slate-800"></td>
                        <td class="p-3 font-bold text-emerald-600 uppercase"></td>
                        <td class="p-3">
                            <a href="/admin/Portal/question//change/" class="px-3 py-1 bg-purple-50 text-purple-600 rounded-lg text-xs font-semibold hover:bg-purple-100">
                                <i class="fa-solid fa-pen-to-square"></i> Edit
                            </a>
                        </td>
                    </tr>
                    
                    <tr>
                        <td colspan="5" class="p-4 text-center text-slate-400">No questions found in the database.</td>
                    </tr>
                    
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Certificates</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-purple-50 min-h-screen p-8 text-slate-700">
    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-sm p-6 border border-purple-100">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-slate-900"><i class="fa-solid fa-award text-purple-600 mr-2"></i>Issued Student Certificates</h1>
            <a href="admin_dashboard.html" class="text-xs bg-purple-100 text-purple-700 font-semibold px-4 py-2 rounded-xl">Back to Dashboard</a>
        </div>

        <div class="overflow-x-auto" >
            <table class="w-full text-left text-sm text-slate-600">
                <thead class="bg-purple-50 text-purple-900 font-semibold border-b border-purple-100">
                    <tr>
                        <th class="p-3">Student Name</th>
                        <th class="p-3">Exam Passed</th>
                        <th class="p-3">Score</th>
                        <th class="p-3">Action</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    
                    <tr class="hover:bg-purple-50/50">
                        <td class="p-3 font-semibold text-slate-900"></td>
                        <td class="p-3"></td>
                        <td class="p-3 text-purple-600 font-bold">%</td>
                        <td class="p-3">
                            <a href="" target="_blank" class="px-3 py-1.5 bg-purple-600 text-white text-xs font-semibold rounded-lg hover:bg-purple-700">
                                <i class="fa-solid fa-file-contract mr-1"></i> View Certificate
                            </a>
                        </td>
                    </tr>
                    
                    <tr>
                        <td colspan="4" class="p-4 text-center text-slate-400">No completed exams available to issue certificates.</td>
                    </tr>
                    
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
